name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Run tests
        run: node --test "test/**/*.test.mjs"
      - name: Inject public OpenRouter key
        env:
          KEY: ${{ secrets.OPENROUTER_PUBLIC_KEY }}
        run: |
          test -n "$KEY" || { echo "OPENROUTER_PUBLIC_KEY is empty"; exit 1; }
          sed -i "s|__OPENROUTER_PUBLIC_KEY__|$KEY|" config.js
          grep -q "sk-or-" config.js || { echo "injection failed"; exit 1; }
          mkdir -p site
          cp -r index.html style.css app.js calc.js data.js config.js .nojekyll site/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
